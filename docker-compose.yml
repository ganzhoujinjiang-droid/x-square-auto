# X → Binance Square 自动同步系统 · Docker Compose（§16.2）
#
# 网络隔离（强制）：postgres/redis/web/api 一律不映射宿主机端口，只在内部网络可达。
# 任何情况下不得出现 5432/6379 → Internet。
# 全部变量来自 .env；本文件不含任何硬编码密码（§25.3）。

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: x_square_auto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d x_square_auto"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"
    networks: [backend]

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "6379"
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/x_square_auto?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "4000"
    networks: [backend, proxy]

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/x_square_auto?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:4000
    depends_on:
      - api
    expose:
      - "3000"
    networks: [backend, proxy]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      # 方案 A（推荐）：Caddy 只监听 127.0.0.1:8443，TLS 由宿主机 Nginx/Cloudflare 终结
      - "127.0.0.1:8443:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - web
    networks: [proxy]

volumes:
  postgres_data:
  redis_data:
  caddy_data:

networks:
  backend:
    internal: true
  proxy:
